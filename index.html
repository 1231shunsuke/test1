<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルなWebサイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333;
      background-color: #f5f5f5;
      padding-bottom: 90px;
    }

    header {
      background-color: #440000;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #cc0000;
    }

    section {
      background-color: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: #2c3e50;
      margin-top: 0;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #440000;
      color: white;
      padding: 15px;
      text-align: center;
    }

    footer p {
      margin: 5px 0;
    }

    footer a {
      color: #ecf0f1;
      margin: 0 8px;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>AIについてのサイト</h1>
  </header>

  <main>
    <section>
      <h2>AIについて</h2>
      <p>
        このサイトはAIはどのようなもので、
        どんな場所で使われるかという情報を見れる
      </p>
    </section>

    <section>
      <h2>AIの特徴</h2>
      <p>
        AIのメリット、デメリットなどの記載
      </p>
      <img src="https://github.com/1231shunsuke/test1/blob/main/index.html" alt="サンプル">
    </section>
  </main>

  <footer>
    <p>お問い合わせ：info@example.com</p>
    <p>
      <a href="https://twitter.com/" target="_blank">X</a>
      <a href="https://www.instagram.com/" target="_blank">Instagram</a>
      <a href="https://www.facebook.com/" target="_blank">Facebook</a>
    </p>
  </footer>

</body>
</html>
